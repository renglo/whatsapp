[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "renglo-whatsapp"
version = "1.0.1rc1"
description = "WhatsApp (Meta Cloud API) channel extension for Renglo — webhooks, LINK onboarding, outbound send"
authors = [
    {name = "NOMA Team"}
]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["whatsapp*"]

[tool.setuptools.package-data]
"*" = ["blueprints/*.json"]
